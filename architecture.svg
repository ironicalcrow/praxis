<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"
     font-family="'Segoe UI','Inter',system-ui,sans-serif">
  <defs>
    <marker id="m-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#6366f1"/></marker>
    <marker id="m-cyan"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#22d3ee"/></marker>
    <marker id="m-amber"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#f59e0b"/></marker>
    <marker id="m-pink"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#ec4899"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#0d0d1a"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#a5b4fc" font-size="21" font-weight="700">Praxis — High-Level System Architecture</text>

  <!-- ═══ CLIENT LAYER ═══ -->
  <rect x="40" y="58" width="678" height="108" rx="10" fill="#131328" stroke="#6366f1" stroke-width="2"/>
  <text x="379" y="80"  text-anchor="middle" fill="#6366f1" font-size="9" font-weight="700" letter-spacing="3">CLIENT LAYER</text>
  <text x="379" y="105" text-anchor="middle" fill="#c7d2fe" font-size="17" font-weight="700">React / Vite SPA  ·  port 3000</text>
  <text x="379" y="128" text-anchor="middle" fill="#94a3b8" font-size="12">Auth · CV · Jobs · Applications · Chat · Cover Letters</text>
  <text x="379" y="148" text-anchor="middle" fill="#94a3b8" font-size="12">Roadmaps · Goals · Notifications · useAuth context</text>

  <!-- Arrow: Client → API -->
  <line x1="379" y1="166" x2="379" y2="207" stroke="#6366f1" stroke-width="2" marker-end="url(#m-purple)"/>
  <text x="391" y="192" fill="#4338ca" font-size="10">HTTP REST + WebSocket</text>

  <!-- ═══ API LAYER ═══ -->
  <rect x="40" y="211" width="678" height="152" rx="10" fill="#131328" stroke="#818cf8" stroke-width="2"/>
  <text x="379" y="233" text-anchor="middle" fill="#818cf8" font-size="9" font-weight="700" letter-spacing="3">API LAYER</text>
  <text x="379" y="258" text-anchor="middle" fill="#c7d2fe" font-size="17" font-weight="700">FastAPI  ·  port 8000</text>

  <!-- chips row 1 -->
  <rect x="57"  y="270" width="88"  height="20" rx="4" fill="#1c1c3a"/>
  <text x="101" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">/api/auth</text>
  <rect x="153" y="270" width="70"  height="20" rx="4" fill="#1c1c3a"/>
  <text x="188" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">/api/cv</text>
  <rect x="231" y="270" width="83"  height="20" rx="4" fill="#1c1c3a"/>
  <text x="272" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">/api/jobs</text>
  <rect x="322" y="270" width="126" height="20" rx="4" fill="#1c1c3a"/>
  <text x="385" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">/api/application</text>
  <rect x="456" y="270" width="82"  height="20" rx="4" fill="#1c1c3a"/>
  <text x="497" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">/api/chat</text>
  <rect x="546" y="270" width="140" height="20" rx="4" fill="#1c1c3a"/>
  <text x="616" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">/api/cover-letter</text>

  <!-- chips row 2 -->
  <rect x="57"  y="299" width="88"  height="20" rx="4" fill="#1c1c3a"/>
  <text x="101" y="313" text-anchor="middle" fill="#94a3b8" font-size="10">/api/goals</text>
  <rect x="153" y="299" width="115" height="20" rx="4" fill="#1c1c3a"/>
  <text x="210" y="313" text-anchor="middle" fill="#94a3b8" font-size="10">/api/roadmap</text>
  <rect x="276" y="299" width="149" height="20" rx="4" fill="#1c1c3a"/>
  <text x="350" y="313" text-anchor="middle" fill="#94a3b8" font-size="10">/api/notifications</text>
  <rect x="433" y="299" width="153" height="20" rx="4" fill="#0c1c2a" stroke="#22d3ee" stroke-width="1"/>
  <text x="509" y="313" text-anchor="middle" fill="#22d3ee" font-size="10">WS /ws/notifications</text>

  <text x="379" y="340" text-anchor="middle" fill="#4b5563" font-size="10">get_current_user()  ·  JWT decoded on every request  ·  Pydantic schemas  ·  SQLAlchemy sessions</text>
  <text x="379" y="356" text-anchor="middle" fill="#374151" font-size="10">ARQ task enqueue  ·  WebSocket manager  ·  Supabase Auth client  ·  Redis pub/sub</text>

  <!-- ═══ EXTERNAL SERVICES ═══ -->
  <rect x="740" y="58" width="425" height="305" rx="10" fill="#131328" stroke="#f59e0b" stroke-width="2"/>
  <text x="952" y="80" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700" letter-spacing="3">EXTERNAL SERVICES</text>

  <!-- Groq -->
  <rect x="754" y="90" width="178" height="78" rx="7" fill="#0c1020" stroke="#6366f1" stroke-width="1.5"/>
  <text x="843" y="112" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">Groq LLM</text>
  <text x="843" y="130" text-anchor="middle" fill="#64748b" font-size="10">llama-3.3-70b-versatile</text>
  <text x="843" y="147" text-anchor="middle" fill="#374151" font-size="10">CV parse · Chat · Roadmap</text>
  <text x="843" y="162" text-anchor="middle" fill="#374151" font-size="10">Summarize · Fit score LLM</text>

  <!-- Jina -->
  <rect x="754" y="178" width="178" height="78" rx="7" fill="#0c1020" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="843" y="200" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="700">Jina AI Embeddings</text>
  <text x="843" y="218" text-anchor="middle" fill="#64748b" font-size="10">jina-embeddings-v2-base-en</text>
  <text x="843" y="235" text-anchor="middle" fill="#374151" font-size="10">768-dim vectors</text>
  <text x="843" y="250" text-anchor="middle" fill="#374151" font-size="10">Resume · Job · Pref embed</text>

  <!-- JSearch -->
  <rect x="754" y="266" width="178" height="82" rx="7" fill="#0c1020" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="843" y="288" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">JSearch API</text>
  <text x="843" y="306" text-anchor="middle" fill="#64748b" font-size="10">RapidAPI · 3-key rotation</text>
  <text x="843" y="323" text-anchor="middle" fill="#374151" font-size="10">200 jobs / query</text>
  <text x="843" y="339" text-anchor="middle" fill="#374151" font-size="10">Live + background scrape</text>

  <!-- Supabase Auth -->
  <rect x="942" y="90" width="209" height="114" rx="7" fill="#0c1020" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1046" y="112" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">Supabase Auth</text>
  <text x="1046" y="130" text-anchor="middle" fill="#64748b" font-size="10">JWT issuance + validation</text>
  <text x="1046" y="147" text-anchor="middle" fill="#374151" font-size="10">Register · Login · OAuth</text>
  <text x="1046" y="164" text-anchor="middle" fill="#374151" font-size="10">Token refresh · Stateless</text>
  <text x="1046" y="181" text-anchor="middle" fill="#374151" font-size="10">Mirrors rows → local users table</text>
  <text x="1046" y="197" text-anchor="middle" fill="#2d3748" font-size="10">UUID-based identity</text>

  <!-- Supabase Storage -->
  <rect x="942" y="214" width="209" height="134" rx="7" fill="#0c1020" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1046" y="236" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">Supabase Storage</text>
  <text x="1046" y="254" text-anchor="middle" fill="#64748b" font-size="10">Object store · cvs/ bucket</text>
  <text x="1046" y="271" text-anchor="middle" fill="#374151" font-size="10">PDF · DOCX · images</text>
  <text x="1046" y="288" text-anchor="middle" fill="#374151" font-size="10">cvs/{user_id}/{uuid}.ext</text>
  <text x="1046" y="305" text-anchor="middle" fill="#374151" font-size="10">Signed URL downloads</text>
  <text x="1046" y="322" text-anchor="middle" fill="#374151" font-size="10">Version history via cv_uploads</text>
  <text x="1046" y="339" text-anchor="middle" fill="#2d3748" font-size="10">is_active flag per version</text>

  <!-- Dashed arrow: API right edge → External left edge -->
  <line x1="718" y1="290" x2="740" y2="230" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#m-amber)"/>

  <!-- ═══ BOTTOM ARROWS ═══ -->
  <!-- API → ARQ (dashed cyan, vertical) -->
  <line x1="190" y1="363" x2="190" y2="410" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#m-cyan)"/>
  <!-- API → Data Layer (pink diagonal) -->
  <line x1="420" y1="363" x2="762" y2="410" stroke="#ec4899" stroke-width="1.5" marker-end="url(#m-pink)"/>

  <!-- ═══ ARQ WORKER ═══ -->
  <rect x="40" y="414" width="305" height="292" rx="10" fill="#131328" stroke="#22d3ee" stroke-width="2"/>
  <text x="192" y="436" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="700" letter-spacing="3">BACKGROUND WORKER</text>
  <text x="192" y="460" text-anchor="middle" fill="#c7d2fe" font-size="15" font-weight="700">ARQ Worker</text>
  <text x="192" y="476" text-anchor="middle" fill="#4b5563" font-size="10">Queued via Redis Upstash (TLS)</text>

  <text x="58" y="498" fill="#22d3ee"  font-size="9" font-weight="700" letter-spacing="1">CRON SCHEDULE</text>
  <text x="58" y="516" fill="#94a3b8" font-size="11">• collect_jobs  ·  every 6 hours</text>
  <text x="70" y="532" fill="#475569" font-size="10">  JSearch → Jina embed → upsert jobs</text>
  <text x="58" y="549" fill="#94a3b8" font-size="11">• clean_expired_jobs  ·  daily 01:00</text>
  <text x="70" y="565" fill="#475569" font-size="10">  Remove orphaned jobs + queries</text>
  <text x="58" y="582" fill="#94a3b8" font-size="11">• prune_chat_messages  ·  weekly Sun</text>
  <text x="70" y="598" fill="#475569" font-size="10">  Keep last 2 sessions per conversation</text>

  <text x="58" y="620" fill="#22d3ee" font-size="9" font-weight="700" letter-spacing="1">ON-DEMAND TASKS</text>
  <text x="58" y="638" fill="#94a3b8" font-size="11">• collect_jobs_for_query(query, loc)</text>
  <text x="70" y="654" fill="#475569" font-size="10">  Triggered: CV upload · activate</text>
  <text x="70" y="670" fill="#475569" font-size="10">  Live search (stale) · pool prefetch</text>
  <text x="70" y="686" fill="#475569" font-size="10">  at 60% consumed → top 3 queries</text>
  <text x="58" y="700" fill="#334155" font-size="10">Max 2 concurrent Jina calls (semaphore)</text>

  <!-- ═══ DATA LAYER ═══ -->
  <rect x="358" y="414" width="812" height="292" rx="10" fill="#131328" stroke="#ec4899" stroke-width="2"/>
  <text x="764" y="436" text-anchor="middle" fill="#ec4899" font-size="9" font-weight="700" letter-spacing="3">DATA LAYER</text>

  <!-- PostgreSQL inner -->
  <rect x="372" y="448" width="248" height="244" rx="8" fill="#0d0d1a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="496" y="470" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">PostgreSQL + pgvector</text>
  <text x="496" y="487" text-anchor="middle" fill="#f59e0b" font-size="10">Supabase hosted · SQLAlchemy ORM</text>
  <line x1="386" y1="494" x2="608" y2="494" stroke="#1e1e38" stroke-width="1"/>
  <text x="386" y="510" fill="#475569" font-size="10">users · resumes · cv_uploads</text>
  <text x="386" y="526" fill="#475569" font-size="10">resume_skills · experience · education</text>
  <text x="386" y="542" fill="#475569" font-size="10">applications + history + notes</text>
  <text x="386" y="558" fill="#475569" font-size="10">jobs  (embedding  vector 768-dim)</text>
  <text x="386" y="574" fill="#475569" font-size="10">chat_conversations · sessions</text>
  <text x="386" y="590" fill="#475569" font-size="10">chat_messages (with summaries)</text>
  <text x="386" y="606" fill="#475569" font-size="10">roadmaps · phases · milestones</text>
  <text x="386" y="622" fill="#475569" font-size="10">goals · notifications</text>
  <text x="386" y="638" fill="#475569" font-size="10">job_queries · search_queries</text>
  <text x="386" y="654" fill="#475569" font-size="10">user_prefs  (pref_embedding)</text>
  <text x="386" y="672" fill="#334155" font-size="10">20 tables  ·  pgvector cosine search</text>
  <text x="386" y="686" fill="#334155" font-size="10">ORDER BY cosine_distance ASC LIMIT 50</text>

  <!-- Redis inner -->
  <rect x="632" y="448" width="248" height="244" rx="8" fill="#0d0d1a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="756" y="470" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">Redis  (Upstash TLS)</text>
  <text x="756" y="487" text-anchor="middle" fill="#64748b" font-size="10">In-memory · pub/sub</text>
  <line x1="646" y1="494" x2="868" y2="494" stroke="#1e1e38" stroke-width="1"/>
  <text x="646" y="510" fill="#475569" font-size="10">suggestion_pool:{uid}  · 24 h TTL</text>
  <text x="646" y="526" fill="#475569" font-size="10">job_seen set per user</text>
  <text x="646" y="542" fill="#475569" font-size="10">ARQ background task queue</text>
  <text x="646" y="558" fill="#475569" font-size="10">fit_score cache  (user + job)</text>
  <text x="646" y="576" fill="#22d3ee" font-size="10">pub/sub: real-time notifications</text>
  <text x="646" y="592" fill="#334155" font-size="10">  PUBLISH user:{uid}:notifications</text>
  <text x="646" y="608" fill="#334155" font-size="10">  SUBSCRIBE → WebSocket push</text>
  <text x="646" y="626" fill="#475569" font-size="10">pending confirmation tokens</text>
  <text x="646" y="642" fill="#334155" font-size="10">  chatbot write-op confirm flow</text>

  <!-- Supabase Storage inner -->
  <rect x="892" y="448" width="264" height="244" rx="8" fill="#0d0d1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1024" y="470" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">Supabase Storage</text>
  <text x="1024" y="487" text-anchor="middle" fill="#64748b" font-size="10">cvs/ bucket · Object storage</text>
  <line x1="906" y1="494" x2="1142" y2="494" stroke="#1e1e38" stroke-width="1"/>
  <text x="906" y="510" fill="#475569" font-size="10">cvs/{user_id}/{uuid}.ext</text>
  <text x="906" y="526" fill="#475569" font-size="10">Formats: PDF · DOCX · images</text>
  <text x="906" y="542" fill="#475569" font-size="10">EasyOCR for image CVs</text>
  <text x="906" y="558" fill="#475569" font-size="10">is_active flag on cv_uploads</text>
  <text x="906" y="574" fill="#475569" font-size="10">Signed URL for download</text>
  <text x="906" y="590" fill="#475569" font-size="10">Version history preserved</text>
  <text x="906" y="608" fill="#334155" font-size="10">Original file kept across re-uploads</text>

  <!-- Footer -->
  <line x1="40" y1="722" x2="1160" y2="722" stroke="#1e1e38" stroke-width="1"/>
  <text x="600" y="740" text-anchor="middle" fill="#2d3748" font-size="11">Praxis · AI-Powered Job Application Tracker · Codesprint 2026 · Poridhi.io</text>

</svg>
