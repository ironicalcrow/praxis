[pytest]
testpaths = tests
norecursedirs = frontend node_modules .venv *.egg-info
addopts = --import-mode=importlib -ra
# No test should ever take this long. Guards against a WebSocket read blocking
# forever when the server has nothing queued.
timeout = 30
asyncio_mode = auto
markers =
    api: HTTP-layer tests driven through TestClient
    ws: WebSocket tests
    flow: cross-module integration flows
    bug: pins behaviour of a bug documented in BUG_REPORT.md
filterwarnings =
    ignore::DeprecationWarning
